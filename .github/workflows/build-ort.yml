# Custom ONNX Runtime Android AAR build pipeline
# Reduced operator build: only the ops used by the ArcaeaOffline OCR model
# (see configs/ort/ops.config) are compiled into libonnxruntime.so.
name: Build ONNX Runtime Android AAR

on:
  workflow_dispatch:
    inputs:
      onnxruntime_version:
        description: 'ONNX Runtime git tag to build (e.g. 1.26.0)'
        required: false
        default: '1.26.0'
      release:
        description: 'Create a GitHub Release (tag name = onnxruntime_version)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # gh release create/upload

env:
  VCPKG_TAG: 2025.08.27        # vcpkg checkout pinned by onnxruntime 1.26.0 build.py
  NDK_VERSION: 28.0.13004108   # NDK used by the official ORT Android build image (v1.26.0 Dockerfile)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        # JDK 17 (temurin) for the Android Gradle plugin
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Python 3.10 to match the official ORT build environment.
          # flatbuffers==2.0 (pinned by the ORT Dockerfile) cannot import on Python 3.12, which removed the 'imp' module.
          python-version: '3.10'

      - name: Install Python deps
        # reduce_op_kernels.py needs the flatbuffers package (same version as the ORT Dockerfile)
        run: pip install flatbuffers==2.0

      - name: Set up Android SDK components
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Install and configure ccache
        run: |
          sudo apt-get install -y ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          ccache --max-size=5G

      - name: Restore ccache
        id: cache-ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-ort-${{ inputs.onnxruntime_version }}-${{ hashFiles('configs/ort/*', '.github/workflows/build-ort.yml') }}
          restore-keys: |
            ccache-ort-${{ inputs.onnxruntime_version }}-

      - name: Set up vcpkg
        # vcpkg tag pinned by ORT's build.py (env.VCPKG_TAG); one shared install for all ABIs
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" --single-branch https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_INSTALLATION_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
        env:
          VCPKG_TAG: ${{ env.VCPKG_TAG }}

      - name: Restore vcpkg binary cache
        id: cache-vcpkg-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vcpkg-bincache
          # fingerprint must cover everything that changes the vcpkg ABI hash
          # (cmake version, NDK, configs, workflow) or the cache is never refreshed
          # (exact key hit -> save step skipped -> stale cache restored forever)
          key: vcpkg-ort-${{ inputs.onnxruntime_version }}-${{ env.VCPKG_TAG }}-${{ hashFiles('configs/ort/*', '.github/workflows/build-ort.yml') }}
          restore-keys: |
            vcpkg-ort-${{ inputs.onnxruntime_version }}-

      - name: Clone ONNX Runtime source
        # shallow clone of the pinned tag v<version>, with submodules
        run: |
          git clone --depth 1 --branch "v$ORT_VERSION" --recurse-submodules --shallow-submodules https://github.com/microsoft/onnxruntime.git onnxruntime
          echo "ORT commit: $(git -C onnxruntime rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        env:
          ORT_VERSION: ${{ inputs.onnxruntime_version }}

      - name: Set up CMake
        # Pin CMake to the version used by the official ORT Docker image (3.31.5).
        # ORT 1.26's CMake files are not validated against CMake 4.x.
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '3.31.5'

      - name: Build AAR
        # build_aar_package.py with --include_ops_by_config (reduced ops) and Release config
        run: |
          # vcpkg requires the binary cache dir to already exist
          mkdir -p "$HOME/vcpkg-bincache"
          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/vcpkg-bincache"
          python3 onnxruntime/tools/ci_build/github/android/build_aar_package.py \
            --build_dir="$GITHUB_WORKSPACE/ort-build" \
            --config=Release \
            --android_sdk_path="$ANDROID_HOME" \
            --android_ndk_path="$ANDROID_HOME/ndk/$NDK_VERSION" \
            --include_ops_by_config="$GITHUB_WORKSPACE/configs/ort/ops.config" \
            "$GITHUB_WORKSPACE/configs/ort/aar-build-settings.json"
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}

      - name: Save ccache
        if: always() && steps.cache-ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache-ccache-restore.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: always() && steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vcpkg-bincache
          key: ${{ steps.cache-vcpkg-restore.outputs.cache-primary-key }}

      - name: Package Maven repo
        # zip keeps the com/ top-level; GitHub strips it from raw directory uploads
        run: |
          cd ort-build/aar_out/Release
          python -m zipfile -c maven_repo.zip com

      - name: Upload Maven repo
        # archive: false = direct file upload, the download is the zip itself (no wrapping layer)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ort-build/aar_out/Release/maven_repo.zip
          archive: false

      - name: Create GitHub Release
        # Two channels: dated history tag (one per build date) + version tag (overwrite, consumer contract)
        if: ${{ inputs.release }}
        run: |
          set -e
          cd ort-build/aar_out/Release
          AAR=$(find . -name "onnxruntime-android-*.aar" | head -1)
          SHA=$(sha256sum "$AAR" | cut -d' ' -f1)
          COMMIT=$(git rev-parse HEAD)
          cat > release_notes.md <<EOF
          Custom ONNX Runtime $ORT_VERSION Android AAR (reduced ops build).

          - Build commit: $COMMIT
          - AAR sha256: $SHA
          - Ops included: reduced set for the OCR model (see configs/ort/ops.config at the commit above)
          - ABIs: armeabi-v7a, arm64-v8a, x86, x86_64
          - EPs: CPU (XNNPACK), NNAPI
          - minSdk 24 / targetSdk 34, LTO, shared lib
          EOF
          # history snapshot (dated tag)
          HIST_TAG="$ORT_VERSION-$(date +%Y%m%d)"
          gh release delete "$HIST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$HIST_TAG" \
            --target "$GITHUB_SHA" \
            --title "ONNX Runtime $ORT_VERSION custom build ($(date +%Y-%m-%d))" \
            --notes-file release_notes.md \
            maven_repo.zip
          # stable GAV channel (overwrite)
          gh release delete "$ORT_VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$ORT_VERSION" \
            --target "$GITHUB_SHA" \
            --title "ONNX Runtime $ORT_VERSION custom build" \
            --notes-file release_notes.md \
            "$AAR" maven_repo.zip
        env:
          ORT_VERSION: ${{ inputs.onnxruntime_version }}
